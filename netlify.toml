[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every unknown path must serve index.html for client routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --------------------------------------------------------------- security ---
[[headers]]
  for = "/*"
  [headers.values]
    # Defense in depth. Supabase RLS is the real boundary; these headers stop
    # whole classes of client-side attack and satisfy enterprise review.
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(self), geolocation=(), interest-cohort=()"
    X-XSS-Protection          = "1; mode=block"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy   = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.supabase.co;
      connect-src 'self' https://*.supabase.co https://api.flutterwave.com wss://*.supabase.co;
      frame-src https://checkout.flutterwave.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests
    """

# Long-lived immutable caching for fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached by an intermediary.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
